<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family and Friends — Simulado de Inglês EF6</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --primary: #2b6cb0;
    --primary-soft: #ebf4ff;
    --accent: #ed8936;
    --accent-soft: #fff5e6;
    --success: #38a169;
    --success-soft: #f0fff4;
    --danger: #e53e3e;
    --danger-soft: #fff5f5;
    --text: #1a202c;
    --text-muted: #718096;
    --border: #e2e8f0;
    --radius: 14px;
    --shadow: 0 10px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.02);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #f4f6f8 0%, #e8edf5 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeInDown 0.6s ease;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    color: var(--primary);
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  header p {
    color: var(--text-muted);
    font-size: 1.05rem;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.5;
  }

  .stats-bar {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
    animation: fadeIn 0.5s ease;
  }

  .stat-pill {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-muted);
    box-shadow: var(--shadow);
  }

  .stat-pill span { color: var(--primary); }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
    animation: fadeIn 0.5s ease;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 12px 24px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    box-shadow: var(--shadow);
  }

  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), #4299e1);
    color: #fff;
  }
  .btn-primary:hover { box-shadow: 0 8px 20px rgba(43,108,176,0.25); }

  .btn-accent {
    background: linear-gradient(135deg, var(--accent), #f6ad55);
    color: #fff;
  }
  .btn-accent:hover { box-shadow: 0 8px 20px rgba(237,137,54,0.25); }

  .btn-outline {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { background: var(--bg); }

  .quiz-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    animation: fadeInUp 0.5s ease both;
    position: relative;
    overflow: hidden;
  }

  .quiz-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    background: var(--primary);
    border-radius: var(--radius) 0 0 var(--radius);
  }

  .question-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .q-number {
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 4px 10px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .q-category {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .question-text {
    font-size: 1.08rem;
    line-height: 1.55;
    margin-bottom: 16px;
    font-weight: 500;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    background: #fff;
  }

  .option:hover { background: var(--bg); border-color: #cbd5e0; }

  .option input[type="radio"] {
    accent-color: var(--primary);
    width: 18px; height: 18px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .option label {
    flex: 1;
    cursor: pointer;
    font-size: 0.98rem;
    line-height: 1.4;
  }

  .option.correct {
    background: var(--success-soft);
    border-color: var(--success);
    color: #22543d;
  }
  .option.wrong {
    background: var(--danger-soft);
    border-color: var(--danger);
    color: #742a2a;
  }
  .option.correct input, .option.wrong input { accent-color: currentColor; }

  .explanation {
    margin-top: 14px;
    padding: 14px;
    border-radius: 10px;
    background: #f7fafc;
    border-left: 4px solid var(--accent);
    font-size: 0.92rem;
    color: #4a5568;
    line-height: 1.5;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .result-panel {
    background: linear-gradient(135deg, var(--primary-soft), #fff);
    border: 1px solid #bee3f8;
    border-radius: var(--radius);
    padding: 28px;
    text-align: center;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
    animation: fadeIn 0.5s ease;
    display: none;
  }

  .result-panel h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .result-panel .score-big {
    font-size: 3rem;
    font-weight: 700;
    color: var(--text);
    margin: 8px 0;
  }

  .result-panel .score-label {
    color: var(--text-muted);
    font-size: 1rem;
  }

  .result-panel .message {
    margin-top: 10px;
    font-weight: 500;
    color: var(--accent);
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 32px;
    padding-bottom: 24px;
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 560px) {
    body { padding: 14px; }
    .quiz-card { padding: 20px; }
    button { width: 100%; }
    .controls { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Family and Friends</h1>
    <p>Simulado de Inglês e Gramática. Cada prova sorteia 25 questões aleatórias com explicações didáticas.</p>
  </header>

  <div class="stats-bar">
    <div class="stat-pill">Questões no banco: <span id="total-q">0</span></div>
    <div class="stat-pill">Prova atual: <span id="current-q">0</span>/25</div>
    <div class="stat-pill">Acertos: <span id="correct-count">0</span></div>
  </div>

  <div class="controls">
    <button class="btn-primary" onclick="checkQuiz()">✅ Corrigir Prova</button>
    <button class="btn-accent" onclick="newQuiz()">🔄 Nova Prova (25 aleatórias)</button>
  </div>

  <div class="result-panel" id="resultPanel">
    <h2>Resultado da Prova</h2>
    <div class="score-big" id="scoreValue">0/25</div>
    <div class="score-label">acertos</div>
    <div class="message" id="scoreMessage">Boa sorte na próxima!</div>
  </div>

  <div id="quizContainer"></div>

  <footer>
    Bernoulli EF6 — Capítulo 2: Family and Friends · Simulado de Inglês
  </footer>
</div>

<script>
const questionBank = [
  // ===== FAMILY VOCABULARY (30 questões) =====
  {category:"Family Vocab", q:"Qual é a tradução de 'grandfather' em português?", options:["avô","avó","tio","primo"], answer:0, explanation:"Grandfather = avô (pai do pai ou da mãe). Grandmother = avó."},
  {category:"Family Vocab", q:"Qual é a tradução de 'grandmother' em português?", options:["avó","avô","tia","prima"], answer:0, explanation:"Grandmother = avó (mãe do pai ou da mãe). Grandfather = avô."},
  {category:"Family Vocab", q:"A palavra 'parents' em inglês significa...", options:["pai e mãe juntos","só o pai","só a mãe","avós"], answer:0, explanation:"Parents = pai + mãe (plural de parent, que significa um dos pais)."},
  {category:"Family Vocab", q:"A palavra 'siblings' em inglês significa...", options:["irmãos e irmãs juntos","só irmãos","só irmãs","primos"], answer:0, explanation:"Siblings = brother + sister (todos os irmãos, sem distinção de gênero)."},
  {category:"Family Vocab", q:"A palavra 'children' em inglês significa...", options:["filhos (filha + filho)","só filhas","só filhos","sobrinhos"], answer:0, explanation:"Children = plural de child. Inclui filhas (daughters) e filhos (sons)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'half-brother' em português?", options:["meio-irmão","irmão adotivo","primo","cunhado"], answer:0, explanation:"Half-brother = meio-irmão (um dos pais em comum). Diferente de stepbrother."},
  {category:"Family Vocab", q:"Qual é a tradução de 'stepmother' em português?", options:["madrasta","mãe","sogra","tia"], answer:0, explanation:"Stepmother = madrasta (nova esposa do pai, sem parentesco biológico)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'stepfather' em português?", options:["padrasto","pai","sogro","tio"], answer:0, explanation:"Stepfather = padrasto (novo marido da mãe, sem parentesco biológico)."},
  {category:"Family Vocab", q:"A expressão 'only child' significa...", options:["filho único","filho adotivo","filho primogênito","filho preferido"], answer:0, explanation:"Only child = pessoa que não tem irmãos. Ex: 'Daniel is an only child.'"},
  {category:"Family Vocab", q:"Qual é a tradução de 'father-in-law' em português?", options:["sogro","padrasto","avô","tio"], answer:0, explanation:"Father-in-law = sogro (pai do cônjuge). O sufixo '-in-law' indica parentesco por casamento."},
  {category:"Family Vocab", q:"Qual é a tradução de 'mother-in-law' em português?", options:["sogra","madrasta","avó","tia"], answer:0, explanation:"Mother-in-law = sogra (mãe do cônjuge)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'brother-in-law' em português?", options:["cunhado","primo","meio-irmão","sogro"], answer:0, explanation:"Brother-in-law = cunhado (irmão do cônjuge, ou marido da irmã)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'sister-in-law' em português?", options:["cunhada","prima","meia-irmã","sogra"], answer:0, explanation:"Sister-in-law = cunhada (irmã do cônjuge, ou esposa do irmão)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'son-in-law' em português?", options:["genro","sobrinho","primo","cunhado"], answer:0, explanation:"Son-in-law = genro (marido da filha)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'daughter-in-law' em português?", options:["nora","sobrinha","prima","cunhada"], answer:0, explanation:"Daughter-in-law = nora (esposa do filho)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'nephew' em português?", options:["sobrinho","primo","filho","neto"], answer:0, explanation:"Nephew = sobrinho (filho do irmão ou da irmã)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'niece' em português?", options:["sobrinha","prima","filha","neta"], answer:0, explanation:"Niece = sobrinha (filha do irmão ou da irmã)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'cousin' em português?", options:["primo/prima","sobrinho","tio","irmão"], answer:0, explanation:"Cousin = primo ou prima (mesma palavra para ambos os gêneros em inglês)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'uncle' em português?", options:["tio","tia","primo","avô"], answer:0, explanation:"Uncle = tio (irmão do pai ou da mãe, ou marido da tia)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'aunt' em português?", options:["tia","tio","prima","avó"], answer:0, explanation:"Aunt = tia (irmã do pai ou da mãe, ou esposa do tio)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'grandson' em português?", options:["neto","sobrinho","filho","primo"], answer:0, explanation:"Grandson = neto (filho do filho ou da filha)."},
  {category:"Family Vocab", q:"Qual é a tradução de 'granddaughter' em português?", options:["neta","sobrinha","filha","prima"], answer:0, explanation:"Granddaughter = neta (filha do filho ou da filha)."},
  {category:"Family Vocab", q:"A palavra 'relatives' em inglês significa...", options:["parentes em geral","só pais","só filhos","só irmãos"], answer:0, explanation:"Relatives = parentes em geral (inclui tios, primos, avós, sobrinhos, etc.)."},
  {category:"Family Vocab", q:"A palavra 'twin' em inglês significa...", options:["gêmeo/gêmea","primo","meio-irmão","filho único"], answer:0, explanation:"Twin = gêmeo/gêmea. 'Identical twins' = gêmeos idênticos."},
  {category:"Family Vocab", q:"Qual é a diferença entre 'half-brother' e 'stepbrother'?", options:["Half-brother tem um pai ou mãe biológico em comum; stepbrother não tem parentesco biológico","Não há diferença","Stepbrother é irmão biológico","Half-brother é primo"], answer:0, explanation:"Half-brother = meio-irmão (um genitor em comum). Stepbrother = filho do novo cônjuge do pai/mãe (sem vínculo biológico)."},
  {category:"Family Vocab", q:"A palavra 'husband' significa...", options:["marido","esposa","noivo","namorado"], answer:0, explanation:"Husband = marido (homem casado). Wife = esposa."},
  {category:"Family Vocab", q:"A palavra 'wife' significa...", options:["esposa","marido","noiva","namorada"], answer:0, explanation:"Wife = esposa (mulher casada). Husband = marido."},
  {category:"Family Vocab", q:"A palavra 'divorced' significa...", options:["divorciado","casado","solteiro","viúvo"], answer:0, explanation:"Divorced = divorciado (quando um casamento termina legalmente)."},
  {category:"Family Vocab", q:"A palavra 'married' significa...", options:["casado","divorciado","solteiro","noivo"], answer:0, explanation:"Married = casado. 'They are married' = eles são casados."},

  // ===== PROFESSIONS (30 questões) =====
  {category:"Professions", q:"Qual é a tradução de 'doctor' em português?", options:["médico","enfermeiro","professor","advogado"], answer:0, explanation:"Doctor = médico (quem diagnostica e trata doenças). Nurse = enfermeiro."},
  {category:"Professions", q:"Qual é a tradução de 'nurse' em português?", options:["enfermeiro/enfermeira","médico","professor","bombeiro"], answer:0, explanation:"Nurse = enfermeiro/enfermeira (quem cuida de pacientes junto com médicos)."},
  {category:"Professions", q:"Qual é a tradução de 'teacher' em português?", options:["professor/professora","médico","engenheiro","advogado"], answer:0, explanation:"Teacher = professor/professora (quem ensina em escolas)."},
  {category:"Professions", q:"Qual é a tradução de 'engineer' em português?", options:["engenheiro","arquiteto","mecânico","construtor"], answer:0, explanation:"Engineer = engenheiro (projeta e constrói estruturas, máquinas, sistemas)."},
  {category:"Professions", q:"Qual é a tradução de 'mechanic' em português?", options:["mecânico","engenheiro","eletricista","pedreiro"], answer:0, explanation:"Mechanic = mecânico (conserta carros, motores e máquinas)."},
  {category:"Professions", q:"Qual é a tradução de 'firefighter' em português?", options:["bombeiro","policial","soldado","guarda"], answer:0, explanation:"Firefighter = bombeiro (combate incêndios e resgata pessoas)."},
  {category:"Professions", q:"Qual é a tradução de 'police officer' em português?", options:["policial","bombeiro","soldado","segurança"], answer:0, explanation:"Police officer = policial (faz a segurança pública e aplica a lei)."},
  {category:"Professions", q:"Qual é a tradução de 'taxi driver' em português?", options:["motorista de táxi","motorista de ônibus","caminhoneiro","piloto"], answer:0, explanation:"Taxi driver = motorista de táxi."},
  {category:"Professions", q:"Qual é a tradução de 'lawyer' em português?", options:["advogado","juiz","policial","promotor"], answer:0, explanation:"Lawyer = advogado (defende clientes na justiça). Judge = juiz."},
  {category:"Professions", q:"Qual é a tradução de 'homemaker' em português?", options:["dona de casa","faxineira","cozinheira","babá"], answer:0, explanation:"Homemaker = dona de casa (quem cuida do lar e da família). Também se usa 'housewife', mas 'homemaker' é mais inclusivo."},
  {category:"Professions", q:"Qual é a tradução de 'actor' em português?", options:["ator","atriz","modelo","cantor"], answer:0, explanation:"Actor = ator (masculino). Actress = atriz (feminino)."},
  {category:"Professions", q:"Qual é a tradução de 'actress' em português?", options:["atriz","ator","modelo","dançarina"], answer:0, explanation:"Actress = atriz (feminino). Actor = ator (masculino)."},
  {category:"Professions", q:"Qual é a tradução de 'model' (profissão) em português?", options:["modelo","moda","manequim","escultor"], answer:0, explanation:"Model = modelo (quem posa para fotos, desfiles e comerciais)."},
  {category:"Professions", q:"Qual é a tradução de 'architect' em português?", options:["arquiteto","engenheiro","pedreiro","designer"], answer:0, explanation:"Architect = arquiteto (projeta casas, prédios e espaços)."},
  {category:"Professions", q:"Qual é a tradução de 'casting director' em português?", options:["diretor de elenco","diretor de cinema","produtor","roteirista"], answer:0, explanation:"Casting director = diretor de elenco (escolhe os atores para um filme/peça)."},
  {category:"Professions", q:"Qual é a tradução de 'literary agent' em português?", options:["agente literário","escritor","editor","bibliotecário"], answer:0, explanation:"Literary agent = agente literário (representa escritores e negocia contratos)."},
  {category:"Professions", q:"Antes de uma profissão no SINGULAR, o inglês exige...", options:["o artigo 'a' ou 'an'","o artigo 'the'","nenhum artigo","a preposição 'to'"], answer:0, explanation:"Regra gramatical do inglês: toda profissão no singular precisa de 'a' ou 'an' antes. Ex: a doctor, an engineer."},
  {category:"Professions", q:"Antes de uma profissão no PLURAL, o inglês usa...", options:["nenhum artigo","o artigo 'a'","o artigo 'an'","o artigo 'the'"], answer:0, explanation:"Regra gramatical: no plural, NÃO usamos artigo antes da profissão. Ex: They are doctors."},
  {category:"Professions", q:"Escolha o artigo correto: 'She is ___ nurse.'", options:["a","an","the","—"], answer:0, explanation:"Nurse começa com som de consoante /n/. Portanto, usamos 'a'."},
  {category:"Professions", q:"Escolha o artigo correto: 'He is ___ engineer.'", options:["an","a","the","—"], answer:0, explanation:"Engineer começa com som de vogal /ɛ/. Portanto, usamos 'an'."},
  {category:"Professions", q:"Escolha o artigo correto: 'My father is ___ doctor.'", options:["a","an","the","—"], answer:0, explanation:"Doctor começa com som de consoante /d/. Portanto, usamos 'a'."},
  {category:"Professions", q:"Escolha a opção correta: 'His parents are ___ doctors.'", options:["— (sem artigo)","a","an","the"], answer:0, explanation:"Profissão no plural → sem artigo. 'His parents are doctors.'"},
  {category:"Professions", q:"Escolha a opção correta: 'My brother and my cousin are ___ mechanics.'", options:["— (sem artigo)","a","an","the"], answer:0, explanation:"Profissão no plural → sem artigo. 'They are mechanics.'"},
  {category:"Professions", q:"Escolha o artigo correto: 'She is ___ architect.'", options:["an","a","the","—"], answer:0, explanation:"Architect começa com som de vogal /ɑːr/. Portanto, usamos 'an'."},
  {category:"Professions", q:"Escolha o artigo correto: 'He wants to be ___ actor.'", options:["an","a","the","—"], answer:0, explanation:"Actor começa com som de vogal /æ/. Portanto, usamos 'an'."},
  {category:"Professions", q:"Escolha a opção correta: 'They are ___ police officers.'", options:["— (sem artigo)","a","an","the"], answer:0, explanation:"Profissão no plural → sem artigo. 'They are police officers.'"},
  {category:"Professions", q:"Escolha o artigo correto: 'I want to be ___ teacher.'", options:["a","an","the","—"], answer:0, explanation:"Teacher começa com som de consoante /t/. Portanto, usamos 'a'."},

  // ===== POSSESSIVE ADJECTIVES (30 questões) =====
  {category:"Possessives", q:"O pronome 'I' usa o possessive adjective...", options:["My","Your","His","Her"], answer:0, explanation:"I → My. Exemplo: 'My mother is a doctor.'"},
  {category:"Possessives", q:"O pronome 'He' usa o possessive adjective...", options:["His","Her","Its","Their"], answer:0, explanation:"He → His. Exemplo: 'His brother is a singer.'"},
  {category:"Possessives", q:"O pronome 'She' usa o possessive adjective...", options:["Her","His","Its","Their"], answer:0, explanation:"She → Her. Exemplo: 'Her eyes are beautiful.'"},
  {category:"Possessives", q:"O pronome 'It' usa o possessive adjective...", options:["Its","His","Her","Their"], answer:0, explanation:"It → Its. Usado para coisas, animais e lugares. Ex: 'The city is famous for its food.'"},
  {category:"Possessives", q:"O pronome 'We' usa o possessive adjective...", options:["Our","Their","Your","My"], answer:0, explanation:"We → Our. Exemplo: 'Our school is nice.'"},
  {category:"Possessives", q:"O pronome 'They' usa o possessive adjective...", options:["Their","Our","Your","His"], answer:0, explanation:"They → Their. Exemplo: 'Their son is a firefighter.'"},
  {category:"Possessives", q:"O pronome 'You' usa o possessive adjective...", options:["Your","My","His","Her"], answer:0, explanation:"You → Your. Exemplo: 'Your father is a good soccer player.'"},

  // ===== GENITIVE CASE (30 questões) =====
  {category:"Genitive", q:"O genitive case (caso genitivo) em inglês serve para indicar...", options:["posse (de quem é a coisa)","ação no passado","futuro","pluralização"], answer:0, explanation:"Genitive case indica posse: de quem é algo. Formado com 's ou apenas apóstrofo."},
  {category:"Genitive", q:"A regra geral do genitive case é adicionar...", options:["apóstrofo + s ('s)","somente s","somente apóstrofo","a palavra 'of'"], answer:0, explanation:"Regra geral: adicionamos 's ao possuidor. Ex: Lucy's father = o pai de Lucy."},
  {category:"Genitive", q:"Quando o substantivo já termina em -s (plural regular), usamos...", options:["apenas o apóstrofo (' )","apóstrofo + s ('s)","s + apóstrofo (s')","nada"], answer:0, explanation:"Ex: parents → parents' house (apenas apóstrofo, sem s extra)."},
  {category:"Genitive", q:"'A casa dos meus pais' em inglês, pela gramática padrão, é...", options:["my parents' house","my parent's house","my parents's house","the house of my parents"], answer:0, explanation:"Parents termina em s (plural) → parents' (apenas apóstrofo). 'My parents' house' é a forma natural do inglês."},
  {category:"Genitive", q:"Quando duas ou mais pessoas possuem ALGO EM COMUM (compartilhado), o 's fica...", options:["só no último nome","em todos os nomes","no primeiro nome","em nenhum nome"], answer:0, explanation:"Posse compartilhada: 's apenas no último nome. Ex: 'John and Mary's house' = a casa de John e Mary (uma casa só)."},
  {category:"Genitive", q:"Quando duas ou mais pessoas possuem COISAS DIFERENTES (individual), o 's fica...", options:["em todos os nomes","só no último nome","no primeiro nome","em nenhum nome"], answer:0, explanation:"Posse individual: 's em cada nome. Ex: 'John's and Mary's cars' = o carro de John e o carro de Mary (dois carros)."},
  {category:"Genitive", q:"'O filho de May e Jimmy' (um filho só, de ambos) é...", options:["May and Jimmy's son","May's and Jimmy's son","May and Jimmy son","son of May and Jimmy"], answer:0, explanation:"Um filho só = posse compartilhada → 's no último nome."},
  {category:"Genitive", q:"'As mães de Mary e Lucy' (mães diferentes) é...", options:["Mary's and Lucy's mothers","Mary and Lucy's mothers","Marys and Lucys mothers","mothers of Mary and Lucy"], answer:0, explanation:"Duas mães diferentes = posse individual → 's em cada nome."},
  {category:"Genitive", q:"Nomes próprios terminados em -s usam...", options:["apenas apóstrofo","apóstrofo + s","s + apóstrofo","nada"], answer:0, explanation:"Ex: 'James' car' (apenas apóstrofo). Também aceito 'James's' em alguns dialetos, mas o livro ensina apenas apóstrofo."},
  {category:"Genitive", q:"Complete: '___ house is very comfortable.' (meus pais)", options:["My parents'","My parent's","My parents's","The parents"], answer:0, explanation:"Parents (plural em s) → parents' (apenas apóstrofo)."},
  {category:"Genitive", q:"Complete: '___ clothes are beautiful.' (os príncipes)", options:["The princes'","The prince's","The princes's","Princes"], answer:0, explanation:"Princes (plural em s) → princes' (apenas apóstrofo)."},
  {category:"Genitive", q:"Complete: 'It's ___ swimming cap.' (Leila)", options:["Leila's","Leilas","Leila","of Leila"], answer:0, explanation:"Nome próprio → 's. Leila's = de Leila."},
  {category:"Genitive", q:"Complete: 'It's ___ white coat.' (Maurice)", options:["Maurice's","Maurices","Maurice","of Maurice"], answer:0, explanation:"Maurice's white coat = o jaleco branco de Maurice."},
  {category:"Genitive", q:"Complete: 'It's ___ apartment.' (Maurice)", options:["Maurice's","Maurices","Maurice","of Maurice"], answer:0, explanation:"Maurice's apartment = o apartamento de Maurice."},
  {category:"Genitive", q:"Complete: 'They are ___ and ___ pets.' (Maurice e Leila, animais diferentes)", options:["Maurice's and Leila's","Maurice and Leila's","Maurices and Leilas","of Maurice and Leila"], answer:0, explanation:"Animais diferentes = posse individual → 's em cada nome."},
  {category:"Genitive", q:"Complete: 'It's ___ drawing board.' (Leila)", options:["Leila's","Leilas","Leila","of Leila"], answer:0, explanation:"Leila's drawing board = a prancheta de desenho de Leila."},
  {category:"Genitive", q:"Complete: 'It's ___ bike.' (Maurice)", options:["Maurice's","Maurices","Maurice","of Maurice"], answer:0, explanation:"Maurice's bike = a bicicleta de Maurice."},
  {category:"Genitive", q:"Complete: 'They are ___ daughters.' (Leila)", options:["Leila's","Leilas","Leila","of Leila"], answer:0, explanation:"Leila's daughters = as filhas de Leila."},
  {category:"Genitive", q:"Complete: 'It's ___ stethoscope.' (Maurice)", options:["Maurice's","Maurices","Maurice","of Maurice"], answer:0, explanation:"Maurice's stethoscope = o estetoscópio de Maurice."},
  {category:"Genitive", q:"Complete: 'It's ___ house.' (Leila)", options:["Leila's","Leilas","Leila","of Leila"], answer:0, explanation:"Leila's house = a casa de Leila."},
  {category:"Genitive", q:"Complete: 'It's ___ bedroom.' (Luiza e Pamela, um quarto só)", options:["Luiza and Pamela's","Luiza's and Pamela's","Luiza and Pamela","of Luiza and Pamela"], answer:0, explanation:"Um quarto só = posse compartilhada → 's no último nome."},
  {category:"Genitive", q:"Complete: 'Sally is ___ wife.' (Dale)", options:["Dale's","Dales","Dale","of Dale"], answer:0, explanation:"Dale's wife = a esposa de Dale."},
  {category:"Genitive", q:"Complete: 'Lisa is ___ daughter.' (Sally)", options:["Sally's","Sallys","Sally","of Sally"], answer:0, explanation:"Sally's daughter = a filha de Sally."},
  {category:"Genitive", q:"Complete: 'This is ___ bedroom.' (Jimmy)", options:["Jimmy's","Jimmy","Jimmys","of Jimmy"], answer:0, explanation:"Jimmy's bedroom = o quarto do Jimmy."},
  {category:"Genitive", q:"Atenção: 'Lucy's father lives in California.' O 's aqui é...", options:["genitive case (caso genitivo)","contração de 'Lucy is'","plural","verbo no passado"], answer:0, explanation:"Lucy's = de Lucy (posse). É diferente de 'Lucy's' como contração, que seria informal e raro. No livro, 's após nome = genitive case."},

  // ===== DEMONSTRATIVE PRONOUNS (20 questões) =====
  {category:"Demonstratives", q:"'This' e 'These' indicam que a coisa/pessoa está...", options:["perto de quem fala","longe de quem fala","no passado","no futuro"], answer:0, explanation:"This/These = here (perto do falante)."},
  {category:"Demonstratives", q:"'That' e 'Those' indicam que a coisa/pessoa está...", options:["longe de quem fala","perto de quem fala","no passado","no futuro"], answer:0, explanation:"That/Those = there (longe do falante)."},
  {category:"Demonstratives", q:"'This' e 'That' são usados com substantivos...", options:["singulares","plurais","de qualquer número","somente abstratos"], answer:0, explanation:"This/That = singular. Ex: this book, that car."},

  {category:"Demonstratives", q:"Complete: '___ man over there is our teacher.' (longe)", options:["That","This","These","Those"], answer:0, explanation:"Over there = longe + singular = That."},

  {category:"Demonstratives", q:"Complete: '___ boys are in my class.' (longe, plural)", options:["Those","This","That","These"], answer:0, explanation:"Longe + plural = Those."},
  {category:"Demonstratives", q:"Complete: '___ cat over there is black.' (longe, singular)", options:["That","This","These","Those"], answer:0, explanation:"Over there = longe + singular = That."},
  {category:"Demonstratives", q:"Complete: '___ is my friend Raquel over there.' (longe, apresentando)", options:["That","This","These","Those"], answer:0, explanation:"Apresentar alguém que está longe = That is..."},

  {category:"Demonstratives", q:"Complete: 'Who's ___ girl over there?' (longe, singular)", options:["that","this","these","those"], answer:0, explanation:"Over there + singular = that."},
  {category:"Demonstratives", q:"Complete: '___ shoes are killing me! I need to sit down.' (perto, plural)", options:["These","Those","This","That"], answer:0, explanation:"Perto + plural = These."},

  {category:"There is/are", q:"Para afirmar que UMA coisa existe em algum lugar, usamos...", options:["There is","There are","Is there","Are there"], answer:0, explanation:"There is = há/existe (singular). Ex: There is a book on the table."},
  {category:"There is/are", q:"Para afirmar que VÁRIAS coisas existem em algum lugar, usamos...", options:["There are","There is","Is there","Are there"], answer:0, explanation:"There are = há/existem (plural). Ex: There are two cats in the garden."},
  {category:"There is/are", q:"Para PERGUNTAR se uma coisa existe (singular), usamos...", options:["Is there...?","Are there...?","There is","There are"], answer:0, explanation:"Pergunta singular: Is there a doctor in the hospital?"},
  {category:"There is/are", q:"Para PERGUNTAR se várias coisas existem (plural), usamos...", options:["Are there...?","Is there...?","There are","There is"], answer:0, explanation:"Pergunta plural: Are there any students in the classroom?"},
  {category:"There is/are", q:"Complete: '___ a big house on that street.'", options:["There is","There are","Is there","Are there"], answer:0, explanation:"A big house = singular afirmativo → There is."},
  {category:"There is/are", q:"Complete: '___ three children in their family.'", options:["There are","There is","Are there","Is there"], answer:0, explanation:"Three children = plural afirmativo → There are."},
  {category:"There is/are", q:"Complete: '___ an engineer in your company?'", options:["Is there","Are there","There is","There are"], answer:0, explanation:"An engineer = singular pergunta → Is there."},
  {category:"There is/are", q:"Complete: '___ some books on the shelf.'", options:["There are","There is","Are there","Is there"], answer:0, explanation:"Some books = plural afirmativo → There are."},
  {category:"There is/are", q:"Complete: '___ a swimming pool in the house?'", options:["Is there","Are there","There is","There are"], answer:0, explanation:"A swimming pool = singular pergunta → Is there."},
  {category:"There is/are", q:"Complete: '___ two bedrooms in the apartment.'", options:["There are","There is","Are there","Is there"], answer:0, explanation:"Two bedrooms = plural afirmativo → There are."},
  {category:"There is/are", q:"Complete (negativo): 'No, ___ any milk in the fridge.'", options:["there isn't","there aren't","is there","are there"], answer:0, explanation:"Milk = singular + negativo → there isn't (there is not)."},
  {category:"There is/are", q:"Complete (negativo): 'No, ___ any students in the room.'", options:["there aren't","there isn't","is there","are there"], answer:0, explanation:"Students = plural + negativo → there aren't (there are not)."},
  {category:"There is/are", q:"Complete: 'Yes, ___ many friends at the party.'", options:["there are","there is","are there","is there"], answer:0, explanation:"Many friends = plural afirmativo → there are."},

  {category:"There is/are", q:"Complete: 'You ___ my best friend.'", options:["are","is","am","be"], answer:0, explanation:"You → are (sempre, tanto no singular quanto no plural)."},

  {category:"Wh-Questions", q:"Complete: '___ is your mother?' 'She is a doctor.'", options:["What","Who","Where","How"], answer:0, explanation:"Pergunta sobre profissão = What. 'What is your mother?' = 'Qual a profissão da sua mãe?'"},

let currentQuestions = [];
let isChecked = false;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  isChecked = false;
  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('correct-count').textContent = '0';
  document.getElementById('current-q').textContent = '25';

  currentQuestions = shuffle(questionBank).slice(0, 25);

  currentQuestions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.style.animationDelay = (idx * 0.04) + 's';

    const opts = q.options.map((opt, i) => `
      <div class="option" id="opt-${idx}-${i}" onclick="selectOption(${idx}, ${i})">
        <input type="radio" name="q${idx}" id="radio-${idx}-${i}" value="${i}">
        <label for="radio-${idx}-${i}">${opt}</label>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="question-header">
        <span class="q-number">Questão ${idx + 1}</span>
        <span class="q-category">${q.category}</span>
      </div>
      <div class="question-text">${q.q}</div>
      <div class="options">${opts}</div>
      <div class="explanation" id="exp-${idx}">${q.explanation}</div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, optIdx) {
  if (isChecked) return;
  const radios = document.getElementsByName('q' + qIdx);
  radios.forEach(r => {
    const id = r.id.replace('radio-', 'opt-');
    document.getElementById(id).classList.remove('selected');
  });
  document.getElementById('radio-' + qIdx + '-' + optIdx).checked = true;
}

function checkQuiz() {
  if (isChecked) return;
  isChecked = true;
  let correct = 0;

  currentQuestions.forEach((q, idx) => {
    const radios = document.getElementsByName('q' + idx);
    let selected = -1;
    for (let r of radios) if (r.checked) selected = parseInt(r.value);

    q.options.forEach((_, i) => {
      const el = document.getElementById('opt-' + idx + '-' + i);
      if (i === q.answer) {
        el.classList.add('correct');
      } else if (i === selected && selected !== q.answer) {
        el.classList.add('wrong');
      }
    });

    document.getElementById('exp-' + idx).style.display = 'block';
    if (selected === q.answer) correct++;
  });

  document.getElementById('correct-count').textContent = correct;
  const panel = document.getElementById('resultPanel');
  panel.style.display = 'block';
  document.getElementById('scoreValue').textContent = correct + '/25';

  let msg = '';
  if (correct === 25) msg = '🏆 Perfeito! Você domina a matéria!';
  else if (correct >= 20) msg = '⭐ Excelente desempenho!';
  else if (correct >= 15) msg = '👍 Bom! Continue praticando.';
  else if (correct >= 10) msg = '📚 Revise os tópicos com mais calma.';
  else msg = '💡 Não desista! Clique em Nova Prova e tente de novo.';
  document.getElementById('scoreMessage').textContent = msg;

  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function newQuiz() {
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
document.getElementById('total-q').textContent = questionBank.length;
